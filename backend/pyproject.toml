[project]
name = "factorymark"
version = "0.1.0"
description = "Agente de Inteligencia Competitiva - backend FastAPI (Researcher → Analyst → Strategist → Creator → Publisher)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "langgraph>=1.2.12",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pyjwt[crypto]",
    "scikit-learn>=1.9.1",
    "tenacity",
    "uvicorn[standard]",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]
