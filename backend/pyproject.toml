[project]
name = "factorymark"
version = "0.1.0"
description = "Agente de Inteligencia Competitiva - backend FastAPI (Researcher → Analyst → Strategist → Creator → Publisher)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "scikit-learn>=1.9.1",
    "tenacity",
    "uvicorn[standard]",
]

[project.scripts]
factorymark-api = "factorymark.main:run"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]
